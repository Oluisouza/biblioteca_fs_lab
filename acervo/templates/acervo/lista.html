{% extends 'acervo/base.html' %}

{% block conteudo %}
    <a href="{% url 'novo' %}">Cadastrar livro</a>

    <h1>Acervo</h1>
    <ul>
        {% for livro in livros %}
            <li>{{ livro.titulo }} - {{ livro.autor }}</li>
        {% empty %}
            <li>Nenhum livro encontrado.</li>
        {% endfor %}
    </ul>
{% endblock %}
